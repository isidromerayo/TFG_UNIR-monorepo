version: 2
updates:
  # Mantener al dia las acciones usadas por los workflows activos
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minors:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # Mantener version+digest del pin de Trivy (.github/workflows/trivy.dockerfile)
  - package-ecosystem: "docker"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
