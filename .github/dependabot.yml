version: 2
updates:
  # Mantener al dia las acciones usadas por los workflows activos
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minors:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      actions-majors:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-major"

  # Mantener version+digest del pin de Trivy (.github/workflows/trivy.dockerfile)
  - package-ecosystem: "docker"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
